<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STAR LOGGER — Unit-T</title>
<style>
  :root{
    --bg:#E1E2E1; --panel:#FFFFFF; --panel2:#F4F5F4; --line:#cfd2cf;
    --txt:#3D3D3D; --muted:#6d6f6d;
    --accent:#C4610b; --accent2:#EA8127; --cyan:#077176; --cta:#E5007D;
    --ok:#86D586; --okd:#2f7a2f; --nok:#ff6A6A; --nokd:#b23b3b; --yellow:#FFC421;
    --radius:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.35; display:flex; flex-direction:column; min-height:100%;
  }
  header{
    position:sticky; top:0; z-index:30;
    background:linear-gradient(180deg,#C4610b,#EA8127); color:#fff;
    border-bottom:1px solid #a4500a; padding:6px 12px;
  }
  .brand{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
  .title{display:flex;align-items:center;gap:7px;font-weight:800;font-size:15px;color:#fff}
  .star{color:var(--yellow);font-size:17px}
  .rightctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .langs{display:flex;gap:4px}
  .chip{background:rgba(255,255,255,.85);color:#8a4408;border:1px solid rgba(255,255,255,.6);
    border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px;cursor:pointer}
  .chip.active{background:#fff;color:#C4610b}
  .progress{margin-top:6px;height:5px;background:rgba(255,255,255,.35);border-radius:999px;overflow:hidden}
  .progress>div{height:100%;background:#fff;width:0;transition:width .25s}
  .pmeta{display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:rgba(255,255,255,.9)}

  main{flex:1;display:flex;flex-direction:column;max-width:960px;width:100%;margin:0 auto;padding:10px 12px 0 12px}
  /* Wide screens: guide + log side by side so the log is always visible */
  .layout{display:flex;flex-direction:row;gap:12px;flex:1;min-height:0;align-items:flex-start}
  .guidewrap{flex:1 1 58%;min-width:0}
  .outwrap{flex:1 1 42%;min-width:0;display:flex;flex-direction:column;position:sticky;top:70px}
  @media(max-width:720px){
    .layout{flex-direction:column}
    .outwrap{position:static;width:100%}
  }
  .outhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
  .outhead h3{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .expandbtn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--cyan);
    font-weight:800;font-size:11px;padding:3px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .expandbtn:hover{border-color:var(--accent)}
  #out{min-height:300px;max-height:60vh}
  @media(max-width:720px){ #out{min-height:150px;max-height:200px} }
  /* Full-screen log overlay */
  .logmodal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:210;display:none;align-items:stretch;justify-content:center;padding:16px}
  .logmodal-bg.show{display:flex}
  .logmodal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;max-width:760px;width:100%;display:flex;flex-direction:column}
  .logmodal .lmhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .logmodal .lmhead h3{margin:0;font-size:14px;color:var(--cyan);text-transform:uppercase;letter-spacing:.05em}
  #outBig{flex:1;width:100%;background:#fff;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:14px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.55;white-space:pre;overflow:auto;resize:none;tab-size:8}
  #outBig:focus{outline:none;border-color:var(--accent)}
  .lmactions{display:flex;gap:8px;margin-top:12px}
  .lmactions button{flex:1;padding:12px;border-radius:10px;font-weight:800;cursor:pointer;border:1px solid var(--line)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .stagebadge{display:inline-block;background:var(--panel2);color:var(--cyan);border:1px solid var(--line);
    border-radius:999px;padding:2px 9px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
  .qtitle{font-size:16px;font-weight:800;margin:0 0 3px 0}
  .qsub{color:var(--muted);font-size:12px;margin:0 0 9px 0}
  .normbox{background:#fff7ef;border:1px solid #f0c99b;border-left:3px solid var(--accent2);border-radius:7px;
    padding:8px 10px;font-size:12px;line-height:1.4;margin-bottom:10px;color:#7a4a12}
  .normbox b{color:var(--accent)}

  .values{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
  .values .v{flex:1;min-width:70px}
  .values label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:2px}
  .values input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px;font-size:14px;color:var(--txt)}
  .values input:focus{outline:none;border-color:var(--accent)}

  .oknok{display:flex;gap:8px;margin-bottom:4px}
  .oknok button{flex:1;padding:11px;border-radius:9px;border:2px solid var(--line);background:#fff;color:var(--txt);
    font-weight:800;font-size:14px;cursor:pointer;transition:transform .05s}
  .oknok button:active{transform:scale(.98)}
  .oknok .ok:hover,.oknok .ok.sel{background:var(--ok);border-color:var(--okd);color:#123b12}
  .oknok .nok:hover,.oknok .nok.sel{background:var(--nok);border-color:var(--nokd);color:#4a1414}

  .hints{margin-top:9px;border-top:1px dashed var(--line);padding-top:9px}
  .hints .htitle{font-size:11px;font-weight:800;color:var(--nokd);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .hintbtn{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:var(--panel2);
    border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-size:12.5px;font-weight:600;color:var(--txt);cursor:pointer;margin-bottom:5px}
  .hintbtn:hover{border-color:var(--accent)}
  .hintbtn .plus{color:var(--cta);font-weight:900;font-size:15px}

  .qm{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;
    background:var(--cyan);color:#fff;font-size:11px;font-weight:900;cursor:help;flex:none;margin-left:7px;vertical-align:middle}

  .choice{display:flex;flex-direction:column;gap:7px}
  .choice button{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:2px solid var(--line);
    border-radius:10px;padding:11px;font-size:14px;font-weight:800;color:var(--txt);cursor:pointer}
  .choice button:hover{border-color:var(--accent)}
  .choice button.sel{border-color:var(--accent);background:#fff7ef}
  .choice button .tick{margin-left:auto;color:var(--accent);font-weight:900;font-size:16px;min-width:16px}
  .choice .ic{font-size:19px}
  .choice .desc{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:1px}

  .freetype{margin-bottom:9px}
  .freetype label{display:block;font-weight:700;font-size:12px;margin-bottom:5px}
  .freetype textarea{width:100%;min-height:64px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;
    padding:8px;font-size:14px;color:var(--txt);resize:vertical;font-family:inherit}
  .freetype textarea:focus{outline:none;border-color:var(--accent)}

  .quickphrases{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--panel2)}
  .quickphrases .h5{margin:0 0 7px;color:var(--cyan);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
  .quickphrases .hrow{display:flex;flex-wrap:wrap;gap:5px}
  .quickphrases button{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12px;font-weight:600;color:var(--txt);cursor:pointer}
  .quickphrases .qpsep{flex-basis:100%;height:5px}
  .hrow button:hover{border-color:var(--accent)}
  .sitcard{padding-bottom:10px}
  .sitcard .qtitle{margin-bottom:8px}
  .sitgroup{margin-top:8px}
  .situationRowTitle{font-size:10px;font-weight:800;color:var(--cyan);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .situationButtons{display:flex;flex-wrap:wrap;gap:5px}
  .situationButtons button{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 11px;font-size:13px;font-weight:700;color:var(--txt);cursor:pointer}
  .situationButtons button:hover{border-color:var(--accent)}
  .situationButtons button.sel{background:#fff7ef;border-color:var(--accent);color:var(--txt)}
  .modelTrigger{background:transparent!important;border-style:dashed!important}
  .instchecks{gap:6px}
  .instchecks button{padding:9px 12px;font-size:13px}
  .outheadbtns{display:flex;gap:6px}
  .values input.bad{border-color:#d64545;background:#fdecec;color:#a12020}
  .scorepill{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800}
  .scorepill.good{background:#e3f6e8;color:#1c7a3a;border:1px solid #9ed9b1}
  .scorepill.medium{background:#fff4e0;color:#8a5a12;border:1px solid #f0c988}
  .scorepill.bad{background:#fdecec;color:#a12020;border:1px solid #e6a3a3}
  .lockedhint{margin-top:7px;font-size:11.5px;color:#a12020;background:#fdecec;border:1px solid #e6a3a3;border-radius:7px;padding:6px 9px}
  .subchecks{display:grid;gap:9px;margin-top:4px}
  .subrow{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 9px}
  .sublbl{font-size:13px;font-weight:700;margin-bottom:6px}
  .subrow .oknok{display:flex;gap:7px}
  .subrow .oknok button{flex:1;padding:9px;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer;border:1px solid var(--line)}
  .devrows{display:grid;gap:10px}
  .devrow{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px}
  .devrow .oknok{display:flex;gap:7px;margin-top:7px}
  .devrow .oknok button{flex:1;padding:9px;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer;border:1px solid var(--line)}
  .devdel{flex:0 0 auto!important;background:var(--panel);color:var(--muted);min-width:40px}
  .adddev{margin-top:9px;width:100%;padding:9px;border-radius:8px;border:1px dashed var(--cyan);background:transparent;color:var(--cyan);font-weight:800;font-size:13px;cursor:pointer}
  .adddev:hover{background:#eef9fb}
  .card.stepout{animation:stepout .22s ease forwards}
  @keyframes stepout{to{opacity:.25;transform:translateX(-10px)}}
  .sitlines{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
  .sitlines.empty{color:var(--muted);font-style:italic;font-size:12px;padding:4px 0}
  .sitchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 11px;font-size:12.5px;font-weight:700;color:var(--txt);cursor:pointer}
  .sitchip.sel{background:#fff7ef;border-color:var(--accent)}
  .sitx{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.08);color:var(--muted);font-weight:900;font-size:13px}
  .sitx:hover{background:var(--accent);color:#fff}
  .sitfree{margin-top:9px;margin-bottom:0}
  .sitfree textarea{min-height:46px}
  .modelmodal .modal{max-width:280px}
  .modelmodal .modelopts{display:flex;flex-direction:column;gap:8px}
  .modelmodal .modelopt{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 14px;font-size:15px;font-weight:800;color:var(--txt);cursor:pointer}
  .modelmodal .modelopt:hover{border-color:var(--accent);background:#fff7ef}
  /* Pod-add control */
  .podbox{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:9px}
  .podtitle{font-weight:800;font-size:12px;color:var(--cyan);margin-bottom:6px}
  .podcount{display:flex;gap:5px;margin-bottom:7px}
  .podcount button{flex:1;padding:7px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--txt);font-weight:800;font-size:14px;cursor:pointer}
  .podcount button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  .podroomlbl{font-size:10px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .podrooms{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
  .podrooms button{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--txt);font-size:12px;font-weight:600;cursor:pointer}
  .podrooms button.sel{background:var(--cyan);color:#fff;border-color:var(--cyan)}
  .podadd{width:100%;padding:8px;border-radius:8px;border:1px solid var(--cta);background:var(--cta);color:#fff;font-weight:800;cursor:pointer}

  /* Output notepad */
  #out{width:100%;background:#fbfbfb;color:var(--txt);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.45;
    white-space:pre;overflow:auto;resize:none;tab-size:8}
  #out:focus{outline:none;border-color:var(--accent)}
  .lockmsg{background:#fff7ef;border:1px solid #f0c99b;color:#7a4a12;border-radius:7px;padding:6px 9px;font-size:11.5px;margin-top:5px}

  .navbar{position:sticky;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom,0)) 12px;display:flex;gap:7px;max-width:960px;width:100%;margin:10px auto 0 auto;box-shadow:0 -2px 8px rgba(0,0,0,.05)}
  .navbar button{padding:10px;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer;border:1px solid var(--line)}
  .btn-back{background:var(--panel2);color:var(--txt);flex:0 0 auto;min-width:64px}
  .btn-next{background:var(--accent);color:#fff;border-color:var(--accent);flex:1;min-width:110px}
  .btn-next:disabled{background:var(--panel2);color:var(--muted);border-color:var(--line);cursor:not-allowed}
  .btn-next{display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .kbdhint{font-size:10px;font-weight:700;opacity:.85;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);border-radius:5px;padding:2px 6px;white-space:nowrap}
  .btn-next:disabled .kbdhint{opacity:.5;background:transparent;border-color:var(--line)}
  @media(max-width:520px){ .kbdhint{display:none} }
  .btn-skip{background:transparent;color:var(--muted);flex:0 0 auto}
  .btn-copy{background:var(--cta);color:#fff;border-color:var(--cta);flex:1}
  .btn-mt{background:transparent;color:var(--cyan);border-color:var(--cyan);flex:0 0 auto;font-weight:800}
  .btn-new{background:var(--panel2);color:var(--txt);flex:0 0 auto}

  .tip{position:fixed;z-index:100;max-width:280px;background:#3D3D3D;color:#fff;border:1px solid var(--accent);
    border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .12s}
  .tip.show{opacity:1}
  .tip .warn{color:var(--yellow);font-weight:700}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--cyan);color:#fff;font-weight:800;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:120}
  .toast.show{opacity:1}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:14px}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
  .modal h3{margin:0 0 4px 0}
  .modal .sub{margin:0 0 12px 0;color:var(--muted);font-size:13px}
  .modal label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px 0}
  .modal input,.modal textarea{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:14px;font-family:ui-monospace,monospace}
  .modal textarea{min-height:120px;white-space:pre;overflow:auto}
  .modal .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .modal .actions{display:flex;gap:8px;margin-top:14px}
  .modal .actions button{flex:1;padding:11px;border-radius:9px;font-weight:800;cursor:pointer;border:1px solid var(--line)}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs .chip{color:var(--cyan);background:var(--panel2);border-color:var(--line)}
  .tabs .chip.active{background:var(--cyan);color:#fff}
  .btn-copy2{background:var(--cta);color:#fff;border-color:var(--cta)}
  .btn-grey{background:var(--panel2);color:var(--txt)}
  .hintline{color:var(--muted);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="title"><span class="star">★</span><span id="appTitle">STAR LOGGER</span></div>
    <div class="rightctrls">
      <div class="langs" id="langs">
        <button class="chip active" data-lang="nl">NL</button>
        <button class="chip" data-lang="fr">FR</button>
        <button class="chip" data-lang="en">EN</button>
      </div>
    </div>
  </div>
  <div class="progress"><div id="progressBar"></div></div>
  <div class="pmeta"><span id="crumb"></span><span id="count"></span></div>
</header>

<main>
  <div class="layout">
    <div class="guidewrap"><div id="stepHost"></div></div>
    <div class="outwrap">
      <div class="outhead"><h3 id="outLabel">Log</h3><div class="outheadbtns"><button class="expandbtn" id="btnCopy">⧉ <span id="copyLbl">Kopieer</span></button><button class="expandbtn" id="btnExpand">⛶ <span id="expandLbl">Vergroten</span></button></div></div>
      <textarea id="out" spellcheck="false"></textarea>
      <div class="lockmsg" id="lockMsg"></div>
    </div>
  </div>
</main>

<div class="navbar">
  <button class="btn-back" id="btnBack">◀</button>
  <button class="btn-next" id="btnNext"><span id="btnNextLbl"></span>▶</span><span class="kbdhint">Ctrl+Enter</span></button>
  <button class="btn-mt" id="btnMt">📋</button>
  <button class="btn-new" id="btnNew">↺</button>
</div>

<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<div class="logmodal-bg" id="logModal">
  <div class="logmodal">
    <div class="lmhead"><h3 id="lmTitle">Log</h3><button class="expandbtn" id="lmClose">✕</button></div>
    <textarea id="outBig" spellcheck="false"></textarea>
    <div class="lmactions">
      <button class="btn-copy" id="lmCopy">Kopieer</button>
      <button class="btn-grey" id="lmDone">Sluiten</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="mtModal">
  <div class="modal">
    <h3 id="mtTitle">Modemtest blok</h3>
    <p class="sub" id="mtSub"></p>
    <div class="tabs" id="mtTabs">
      <button class="chip active" data-mttab="align" id="mtTabAlign">Plakken & uitlijnen</button>
      <button class="chip" data-mttab="fields" id="mtTabFields">Snel Rx/Tx/Snr</button>
    </div>
    <div id="mtAlign">
      <label id="lblPaste">Plak hier je modemtest</label>
      <textarea id="mtPaste" placeholder="Mac ...&#10;Node ...&#10;Freq ..."></textarea>
      <div class="hintline" id="mtAlignHint"></div>
    </div>
    <div id="mtFields" style="display:none">
      <div class="row">
        <div><label>Rx</label><input id="fRx" placeholder="5"></div>
        <div><label>Tx</label><input id="fTx" placeholder="38"></div>
      </div>
      <div class="row">
        <div><label>Snr</label><input id="fSnr" placeholder="38"></div>
        <div><label id="lblMac">MAC</label><input id="fMac" placeholder="5C:35:..."></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn-copy2" id="mtInsert">Invoegen</button>
      <button class="btn-grey" id="mtCancel">Annuleer</button>
    </div>
  </div>
</div>
<div class="modal-bg modelmodal" id="modelModal">
  <div class="modal">
    <h3 id="modelTitle">Kies modem</h3>
    <div class="modelopts" id="modelOptions"></div>
    <div class="actions">
      <button class="btn-grey" id="modelCancel">Annuleer</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   STAR LOGGER — Unit-T — guided/forced Modem Health Check
   Builds notepad-style plain text as the tech answers.
   Log output follows the chosen language.
   ============================================================ */

const UI={

/* Which branch check-groups run for the current selection */
function branchGroups(){
  const groups=[];
  selectedTypes().forEach(t=>{
    if(t==="internet") groups.push(...wifiBranch());
    else if(t==="phone") groups.push(...BRANCH.phone);
    else if(t==="idtv"){
      // iDTV routes on box type; boxtype step is added separately in steps()
      if(state.boxtype==="apollo") groups.push(...apolloBranch());
      else groups.push(...BRANCH.stb_qam); // default/qam (Sipadan, V1, V2)
    }
  });
  return groups;
}

/* Build the ordered list of steps */
function steps(){
  const arr=[];
  arr.push({kind:"appointment"});        // 0. install / repair / install update
  // Light jobs (install / install update): only a short optional checklist + free notes.
  if(isLightJob()){
    arr.push({kind:"installcheck"});
    arr.push({kind:"actie"});
    arr.push({kind:"result"});
    return arr;
  }
  // Repair (or before a job is chosen): full guided flow.
  arr.push({kind:"casetype"});           // 1. type (multi-select)
  arr.push({kind:"situatie"});           // 2. situatie
  // 3. forced modem block (Phase 1). Conditional checks (condOn) only appear
  //    when the check they depend on was answered "bad".
  MODEM.forEach(m=>{
    if(m.condOn){ const dep=state.answers[m.condOn]; if(!(dep&&dep.status==="bad")) return; }
    arr.push({kind:"modem",check:m});
  });
  // 3a2. Provisioning / Gateway stage — forced, every case type
  GATEWAY.forEach(g=>arr.push({kind:"gateway",check:g}));
  // 3b. Phase 2 — neighbour comparison via Spot Charts, only for NOK items
  const nb=nokForNeighbour();
  nb.forEach(c=>arr.push({kind:"neighbour",check:c}));
  // 4. branch per selected type; iDTV gets a box-type sub-step first
  selectedTypes().forEach(t=>{
    if(t==="internet") arr.push({kind:"wifiplat"});
    if(t==="idtv") arr.push({kind:"boxtype"});
    const set = t==="internet"?wifiBranch()
              : t==="phone"?BRANCH.phone
              : (state.boxtype==="apollo"?apolloBranch():BRANCH.stb_qam);
    set.forEach(c=>arr.push({kind:"branch",check:c}));
  });
  arr.push({kind:"actie"});
  arr.push({kind:"result"});
  return arr;
}

/* Phase-1 checks that were answered "bad" AND are eligible for neighbour comparison */
function nokForNeighbour(){
  return MODEM.filter(m=>{
    if(!NB_ELIGIBLE.includes(m.id)) return false;
    const a=state.answers[m.id];
    return a && a.status==="bad";
  });
}

/* ============================================================
   Build the log text from answers (plain notepad, chosen lang)
   ============================================================ */
function buildLog(){
  const H=STARHEAD[state.lang], div="____________________";
  const S=[], T=[], A=[], R=[];
  // Keep the selected case type as the first top-level line of the STAR output
  const sel=selectedTypes();
  let typeLine="";
  if(sel.length){
    let types=sel.map(t=>{
      if(t==="idtv"){ const btm={sipadan:"Sipadan/QAM",v1:"TV-box V1",v2:"TV-box V2",apollo:"Apollo/IP"}; const bt=btm[state.boxtype]||null; return "iDTV"+(bt?" ("+bt+")":""); }
      return CASETYPES[t].label[state.lang];
    });
    typeLine="-type: "+types.join(" + ");
  }
  // Appointment outcome sits at the very top of the Situatie section.
  if(state.jobKind && JOBKINDS[state.jobKind]){
    let jl="-"+JOBKINDS[state.jobKind].label[state.lang];
    if(state.jobNet) jl+=" — "+state.jobNet;
    S.push(jl);
  }
  // Install/Install-update checklist lines.
  if(isLightJob()) (state.installChecks||[]).forEach(c=>S.push("-"+c));
  (state.situationLines||[]).forEach(line=>{
    const lc=v=>v&&v.trim()?v.trim().toLowerCase():"";
    const sentence=[lc(line.medium),lc(line.issue),lc(line.frequency)].filter(Boolean).join(" ");
    if(sentence) S.push("-"+sentence);
  });
  if(state.situationCustom&&state.situationCustom.trim()) state.situationCustom.split("\n").forEach(l=>{if(l.trim())S.push(l.replace(/^\s*-?\s*/,"-"));});
  if(!(state.situationLines&&state.situationLines.length) && !(state.situationCustom&&state.situationCustom.trim()) && state.situatie && state.situatie.trim()){
    state.situatie.split("\n").forEach(l=>{ if(l.trim()) S.push(l.replace(/^\s*-?\s*/,"-")); });
  }
  // Testen: modem + branch
  const emit=(check)=>{
    const a=state.answers[check.id];
    if(!a) return;
    // skip conditional checks not triggered
    if(check.condOn){ const dep=state.answers[check.condOn]; if(!(dep&&dep.status==="bad")) return; }
    // Merged multi-sub check (e.g. provisioning): one line per answered sub.
    if(check.subs){
      check.subs.forEach(sub=>{
        const st=a.subs&&a.subs[sub.key];
        if(!st) return;
        T.push(st==="good"?sub.okLine[state.lang]:sub.nokLine[state.lang]);
      });
      (a.hints||[]).forEach(hl=>T.push(hl));
      return;
    }
    // Multi-device QoE: one line per device row.
    if(check.multiDevice && a.devices && a.devices.length){
      a.devices.forEach(d=>{
        const good=d.status==="good";
        const tmpl=good?check.okLine[state.lang]:check.nokLine[state.lang];
        T.push(tmpl.replace("{device}",d.device||"?").replace("{room}",d.room||"?").replace("{connection}",d.connection||"?"));
      });
      (a.hints||[]).forEach(hl=>T.push(hl));
      return;
    }
    let line = a.status==="good" ? check.okLine[state.lang] : check.nokLine[state.lang];
    // fill values
    if(check.values){ check.values.forEach(v=>{ line=line.replace("{"+v.key+"}", (a.values&&a.values[v.key])?a.values[v.key]:"?"); }); }
    T.push(line);
    (a.hints||[]).forEach(hl=>T.push(hl));
  };
  MODEM.forEach(emit);
  GATEWAY.forEach(emit);
  // Phase 2 — neighbour comparison lines (Spot Charts)
  nokForNeighbour().forEach(check=>{
    const nb=state.answers["nb_"+check.id];
    if(!nb || !nb.status) return;
    const same = nb.status==="same";
    const conc = same
      ? {nl:` >buren identiek (Spot Charts) → node-/netwerkprobleem, MO/Aftakdoos`,
         fr:` >voisins identiques (Spot Charts) → problème nœud/réseau, MO/Aftakdoos`,
         en:` >neighbours identical (Spot Charts) → node/network issue, MO/Aftakdoos`}[state.lang]
      : {nl:` >buren ok (Spot Charts) → individueel probleem (klant/drop)`,
         fr:` >voisins ok (Spot Charts) → problème individuel (client/drop)`,
         en:` >neighbours ok (Spot Charts) → individual problem (customer/drop)`}[state.lang];
    T.push(conc);
  });
  branchGroups().forEach(emit);
  // Actie / Resultaat free text
  if(state.actie && state.actie.trim()) state.actie.split("\n").forEach(l=>{ if(l.trim()) A.push(l); });
  if(state.result && state.result.trim()) state.result.split("\n").forEach(l=>{ if(l.trim()) R.push(l); });

  const sec=(title,lines)=>`${title}\n${div}\n${lines.length?lines.join("\n"):"-"}\n`;
  return (typeLine ? typeLine+"\n\n" : "") + [sec(H[0],S),sec(H[1],T),sec(H[2],A),sec(H[3],R)].join("\n");
}

/* Sync log into the textarea unless the user manually edited it on the last step */
function refreshLog(){

/* Scroll the compact log preview so the most recently added input is visible.
   Anchors on the last "real" content line (not a header, divider or empty "-"). */
function scrollPreviewToNewest(){
  const text=out.value;
  const lines=text.split("\n");
  const isDivider=l=>/^_+$/.test(l.trim());
  const isHeader=l=>STARHEAD[state.lang].includes(l.trim());
  // find last meaningful line (a check/hint/free line), skip empty, "-", headers, dividers
  let target=-1;
  for(let i=lines.length-1;i>=0;i--){
    const t=lines[i].trim();
    if(!t||t==="-"||isDivider(lines[i])||isHeader(lines[i])) continue;
    target=i; break;
  }
  if(target<0) return;
  // char offset at end of the target line
  let pos=0; for(let i=0;i<=target;i++) pos+=lines[i].length+1;
  // approximate scroll: line height * target line, keep it a bit above the bottom
  const cs=getComputedStyle(out);
  const lh=parseFloat(cs.lineHeight)|| (parseFloat(cs.fontSize)*1.5) || 18;
  const pad=parseFloat(cs.paddingTop)||0;
  const y=pad + target*lh;
  const desired=y - out.clientHeight + lh*2; // show target near the bottom with a little context
  out.scrollTop=Math.max(0, desired);
}

  $("lmCopy").textContent=tr().copy; $("lmDone").textContent=tr().close;

  // Next button: hidden on last step; disabled on unanswered modem/branch checks (the forcing)
  const btnNext=$("btnNext");

  btnNext.style.display = isLast ? "none" : "";
  $("btnNextLbl").textContent = tr().next+" ▶";
  let needsAnswer=false;
  if(step.kind==="modem"||step.kind==="branch"||step.kind==="gateway"){
    const a=state.answers[step.check.id];
    if(step.check.subs){ needsAnswer = !(a&&a.subs&&step.check.subs.every(s=>a.subs[s.key])); }
    else if(step.check.multiDevice){ needsAnswer = !(a&&a.devices&&a.devices.length&&a.devices.every(d=>d.status)); }
    else needsAnswer = !(a&&a.status);
  }
  if(step.kind==="neighbour"){
    const a=state.answers["nb_"+step.check.id];
    needsAnswer = !(a&&a.status);
  }
  if(step.kind==="casetype"){ needsAnswer = selectedTypes().length===0; }
  if(step.kind==="boxtype"){ needsAnswer = !state.boxtype; }
  if(step.kind==="wifiplat"){ needsAnswer = !state.wifiplat; }
  if(step.kind==="appointment"){ const needsNet=state.jobKind&&JOBKINDS[state.jobKind].nets; needsAnswer = !state.jobKind || (needsNet && !state.jobNet); }
  btnNext.disabled = needsAnswer;

  // lock message: guided until actie/result
  const onFree = step.kind==="actie"||step.kind==="result";
  $("lockMsg").textContent = onFree ? tr().lockOpen : tr().lockGuided;

  let crumb="";
  if(step.kind==="appointment") crumb={nl:"Afspraak",fr:"Rendez-vous",en:"Appointment"}[state.lang];
  else if(step.kind==="installcheck") crumb=STARHEAD[state.lang][1]+" — Install";
  else if(step.kind==="situatie") crumb=STARHEAD[state.lang][0];
  else if(step.kind==="modem") crumb=STARHEAD[state.lang][1]+" — Modem";
  else if(step.kind==="gateway") crumb=STARHEAD[state.lang][1]+" — Provisioning";
  else if(step.kind==="neighbour") crumb=STARHEAD[state.lang][1]+" — Buren";
  else if(step.kind==="casetype") crumb=STARHEAD[state.lang][1];
  else if(step.kind==="boxtype") crumb=STARHEAD[state.lang][1]+" — iDTV";
  else if(step.kind==="wifiplat") crumb=STARHEAD[state.lang][1]+" — IHC";
  else if(step.kind==="branch") crumb=STARHEAD[state.lang][1];
  else if(step.kind==="actie") crumb=STARHEAD[state.lang][2];
  else if(step.kind==="result") crumb=STARHEAD[state.lang][3];
  $("crumb").textContent=crumb;

  if(step.kind==="appointment") renderAppointment();
  else if(step.kind==="installcheck") renderInstallCheck();
  else if(step.kind==="situatie") renderSituatie();
  else if(step.kind==="modem"||step.kind==="branch"||step.kind==="gateway") renderCheck(step.check);
  else if(step.kind==="neighbour") renderNeighbour(step.check);
  else if(step.kind==="casetype") renderCaseType();
  else if(step.kind==="boxtype") renderBoxtype();
  else if(step.kind==="wifiplat") renderWifiplat();
  else if(step.kind==="actie") renderFree("actie");
  else if(step.kind==="result") renderFree("result");

  refreshLog();
}

/* Evaluate a numeric value against a {min,max} threshold. Returns true if OUT of range. */
function outOfRange(val,th){
  if(val===undefined||val===null||(""+val).trim()==="") return false;
  const n=parseFloat((""+val).replace(",","."));
  if(isNaN(n)) return false;
  if(th.min!==undefined && n<th.min) return true;
  if(th.max!==undefined && n>th.max) return true;
  return false;
}
/* Does a threshold check currently have any out-of-range value? */
function checkHasBadValue(check,a){
  if(!check.thresholds||!a||!a.values) return false;
  return Object.keys(check.thresholds).some(k=>outOfRange(a.values[k],check.thresholds[k]));
}
/* Healthscore band: 'good' | 'medium' | 'bad' | null */
function scoreBand(check,a){
  if(!check.scoreBands||!a||!a.values) return null;
  const raw=a.values[check.scoreKey];
  if(raw===undefined||(""+raw).trim()==="") return null;
  const n=parseFloat((""+raw).replace(",","."));
  if(isNaN(n)) return null;
  if(n>=check.scoreBands.good) return "good";
  if(n>=check.scoreBands.medium) return "medium";
  return "bad";
}

function badgeFor(check){
  const isModem = MODEM.some(m=>m.id===check.id);
  const isGw = GATEWAY.some(g=>g.id===check.id);
  return isModem ? STARHEAD[state.lang][1]+" — Modem/RF"
       : isGw ? STARHEAD[state.lang][1]+" — Provisioning"
       : STARHEAD[state.lang][1]+" — Inhome";
}

function renderCheck(check){
  if(check.subs) return renderMultiCheck(check);
  if(check.multiDevice) return renderDeviceCheck(check);
  const a=state.answers[check.id]||{status:null,values:{},hints:[]};
  const t=tr();
  const band=scoreBand(check,a);
  const lockedBad=checkHasBadValue(check,a) || band==="bad"; // out-of-range → forced NOK, OK disabled
  let valHtml="";
  if(check.values){
    valHtml=`<div class="values">`+check.values.map(v=>{
      const val=(a.values&&a.values[v.key])?a.values[v.key]:"";
      const th=check.thresholds&&check.thresholds[v.key];
      const bad=th&&outOfRange(val,th);
      return `<div class="v"><label>${v.label[state.lang]}</label><input class="${bad?'bad':''}" data-vkey="${v.key}" value="${escapeHtml(val)}" inputmode="decimal"></div>`;
    }).join("")+`</div>`;
    if(band) valHtml+=`<div class="scorepill ${band}">${ {good:"OK",medium:"medium",bad:"laag"}[band] }</div>`;
  }
  let hintsHtml="";
  if(a.status==="bad" && check.hints && check.hints.length){
    hintsHtml=`<div class="hints"><div class="htitle">${t.hintsTitle}</div>`+
      check.hints.map((h,i)=>`<button class="hintbtn" data-hint="${i}"><span class="plus">＋</span>${h.label[state.lang]}</button>`).join("")+
      `</div>`;
  }
  const isJaNee = check.answer==="janee";
  const okDisabled = lockedBad ? "disabled" : "";
  let btns;
  if(isJaNee){
    const yesBad = check.bad==="yes";
    btns = `
      <button class="${yesBad?'nok':'ok'} ${a.status===(yesBad?'bad':'good')?'sel':''}" data-good="${yesBad?'bad':'good'}" ${yesBad?'':okDisabled}>${t.yes}</button>
      <button class="${yesBad?'ok':'nok'} ${a.status===(yesBad?'good':'bad')?'sel':''}" data-good="${yesBad?'good':'bad'}" ${yesBad?okDisabled:''}>${t.no}</button>`;
  } else {
    btns = `
      <button class="ok ${a.status==='good'?'sel':''}" data-good="good" ${okDisabled}>✓ ${t.ok}</button>
      <button class="nok ${a.status==='bad'?'sel':''}" data-good="bad">✕ ${t.nok}</button>`;
  }
  host.innerHTML=`<div class="card">
    <div class="stagebadge">${badgeFor(check)}</div>
    <h2 class="qtitle">${check.title[state.lang]}<span class="qm" id="qmTip">?</span></h2>
    <div class="normbox">${check.norm[state.lang]}</div>
    ${valHtml}
    <div class="oknok">${btns}</div>
    ${lockedBad?`<div class="lockedhint">${ {nl:"Waarde buiten de norm → NOK. Pas de waarde aan om OK te kunnen kiezen.",fr:"Valeur hors norme → NOK.",en:"Value out of range → NOK."}[state.lang] }</div>`:""}
    ${hintsHtml}
  </div>`;

  attachTip($("qmTip"),()=>check.tip[state.lang]);

  host.querySelectorAll("input[data-vkey]").forEach(inp=>{
    // While typing: just store the value + refresh log. Don't judge yet (so "4" before "42" isn't flagged).
    inp.addEventListener("input",()=>{
      const cur=state.answers[check.id]||{status:null,values:{},hints:[]};
      cur.values=cur.values||{}; cur.values[inp.dataset.vkey]=inp.value;
      state.answers[check.id]=cur; refreshLog();
    });
    // On leaving the field: evaluate thresholds. Only re-render when the verdict changes,
    // so tabbing between fields stays smooth.
    inp.addEventListener("blur",()=>{
      const cur=state.answers[check.id]||{status:null,values:{},hints:[]};
      const isBad = checkHasBadValue(check,cur) || scoreBand(check,cur)==="bad";
      if(isBad && cur.status!=="bad"){ cur.status="bad"; state.answers[check.id]=cur; render(); }
      else { state.answers[check.id]=cur; refreshLog(); }
    });
  });
  host.querySelectorAll(".oknok button").forEach(b=>{
    if(b.disabled) return;
    b.addEventListener("click",()=>{
      const cur=state.answers[check.id]||{values:{},hints:[]};
      // Muyle nudge: forcing OK on a below-85 healthscore.
      if(b.dataset.good==="good" && check.scoreBands){
        const n=parseFloat(((cur.values&&cur.values[check.scoreKey])||"").toString().replace(",","."));
        if(!isNaN(n) && n<85 && !confirm(muyleMsg(n))) return;
      }
      cur.status=b.dataset.good;
      if(cur.status==="good") cur.hints=[];
      state.answers[check.id]=cur;
      const goingNext = cur.status==="good";
      render();
      if(goingNext){ cueNext(); setTimeout(()=>{ next(); },220); }
    });
  });
  host.querySelectorAll(".hintbtn").forEach(b=>{
    b.addEventListener("click",()=>{
      const i=+b.dataset.hint;
      const cur=state.answers[check.id]; cur.hints=cur.hints||[];
      cur.hints.push(check.hints[i].line[state.lang]);
      state.answers[check.id]=cur; refreshLog();
      toast("＋");
    });
  });
}

function muyleMsg(n){
  return {nl:"Zeker? "+n+" is een beetje laag… Ronald Muyle would not be proud 😉",
          fr:"Sûr ? "+n+" c'est un peu bas… Ronald Muyle would not be proud 😉",
          en:"Sure? "+n+" is a bit low… Ronald Muyle would not be proud 😉"}[state.lang];
}

/* Merged multi-sub check (Procera / WAN IPv4 / modem RJ45 speed) */
function renderMultiCheck(check){
  const t=tr();
  const a=state.answers[check.id]||{subs:{},hints:[]};
  a.subs=a.subs||{};
  const subHtml=check.subs.map((sub,i)=>{
    const st=a.subs[sub.key];
    const yesBad=sub.bad==="yes";
    return `<div class="subrow"><div class="sublbl">${sub.label[state.lang]}</div><div class="oknok">
      <button class="${yesBad?'nok':'ok'} ${st==='good'?'sel':''}" data-sub="${sub.key}" data-good="good">✓ ${t.ok}</button>
      <button class="nok ${st==='bad'?'sel':''}" data-sub="${sub.key}" data-good="bad">✕ ${t.nok}</button>
    </div></div>`;
  }).join("");
  host.innerHTML=`<div class="card">
    <div class="stagebadge">${badgeFor(check)}</div>
    <h2 class="qtitle">${check.title[state.lang]}<span class="qm" id="qmTip">?</span></h2>
    <div class="normbox">${check.norm[state.lang]}</div>
    <div class="subchecks">${subHtml}</div>
  </div>`;
  attachTip($("qmTip"),()=>check.tip[state.lang]);
  host.querySelectorAll("[data-sub]").forEach(b=>b.addEventListener("click",()=>{
    const cur=state.answers[check.id]||{subs:{},hints:[]}; cur.subs=cur.subs||{};
    cur.subs[b.dataset.sub]=b.dataset.good;
    // overall status good only when every sub is good
    cur.status=check.subs.every(s=>cur.subs[s.key]==="good")?"good":(Object.keys(cur.subs).length?"bad":null);
    state.answers[check.id]=cur; render();
    // auto-advance once all subs are good
    if(check.subs.every(s=>cur.subs[s.key]==="good")){ cueNext(); setTimeout(()=>next(),220); }
  }));
}

/* Multi-device QoE: repeatable device/room/connection rows, each OK/NOK */
function renderDeviceCheck(check){
  const t=tr();
  const a=state.answers[check.id]||{devices:[],hints:[]};
  a.devices=a.devices&&a.devices.length?a.devices:[{device:"",room:"",connection:"",status:null}];
  const rowsHtml=a.devices.map((d,i)=>`<div class="devrow">
    <div class="values">${check.deviceFields.map(f=>`<div class="v"><label>${f.label[state.lang]}</label><input data-di="${i}" data-dk="${f.key}" value="${escapeHtml(d[f.key]||"")}"></div>`).join("")}</div>
    <div class="oknok">
      <button class="ok ${d.status==='good'?'sel':''}" data-di="${i}" data-good="good">✓ ${t.ok}</button>
      <button class="nok ${d.status==='bad'?'sel':''}" data-di="${i}" data-good="bad">✕ ${t.nok}</button>
      ${a.devices.length>1?`<button class="devdel" data-del="${i}">✕</button>`:""}
    </div>
  </div>`).join("");
  host.innerHTML=`<div class="card">
    <div class="stagebadge">${badgeFor(check)}</div>
    <h2 class="qtitle">${check.title[state.lang]}<span class="qm" id="qmTip">?</span></h2>
    <div class="normbox">${check.norm[state.lang]}</div>
    <div class="devrows">${rowsHtml}</div>
    <button class="adddev" id="addDev">＋ ${ {nl:"toestel",fr:"appareil",en:"device"}[state.lang] }</button>
  </div>`;
  attachTip($("qmTip"),()=>check.tip[state.lang]);
  const commit=()=>{ 
    // overall status: good only if at least one device and all are good
    a.status=a.devices.length && a.devices.every(d=>d.status==="good")?"good":(a.devices.some(d=>d.status)?"bad":null);
    state.answers[check.id]=a;
  };
  host.querySelectorAll("input[data-di]").forEach(inp=>inp.addEventListener("input",()=>{
    a.devices[+inp.dataset.di][inp.dataset.dk]=inp.value; commit(); refreshLog();
  }));
  host.querySelectorAll(".oknok button[data-good]").forEach(b=>b.addEventListener("click",()=>{
    a.devices[+b.dataset.di].status=b.dataset.good; commit(); render();
    if(a.status==="good"){ cueNext(); setTimeout(()=>next(),220); }
  }));
  host.querySelectorAll("[data-del]").forEach(x=>x.addEventListener("click",()=>{
    a.devices.splice(+x.dataset.del,1); commit(); render();
  }));
  $("addDev").addEventListener("click",()=>{
    a.devices.push({device:"",room:"",connection:"",status:null}); commit(); render();
  });
}

  </div>`;
  const ta=$("freeInput");
  const insert=(line)=>{ const cur=ta.value; ta.value = cur && !cur.endsWith("\n") ? cur+"\n"+line : cur+line;
    if(isActie) state.actie=ta.value; else state.result=ta.value; refreshLog(); ta.focus(); };
  ta.addEventListener("input",()=>{ if(isActie) state.actie=ta.value; else state.result=ta.value; refreshLog(); });
  host.querySelectorAll("[data-h]").forEach(b=>b.addEventListener("click",()=>insert(help[+b.dataset.h].line[state.lang])));
  if(isActie){
    let podN=0; const rooms=new Set();
    host.querySelectorAll("#podCount button").forEach(b=>b.addEventListener("click",()=>{
      podN=+b.dataset.pod;
      host.querySelectorAll("#podCount button").forEach(x=>x.classList.toggle("sel",x===b));
    }));
    host.querySelectorAll("#podRooms button").forEach(b=>b.addEventListener("click",()=>{
      const k=b.dataset.room; if(rooms.has(k)){rooms.delete(k);b.classList.remove("sel");} else {rooms.add(k);b.classList.add("sel");}
    }));
    $("podAdd").addEventListener("click",()=>{
      const n=podN||1;
      const roomNames=ROOMS.filter(r=>rooms.has(r.k)).map(r=>r.label[state.lang].toLowerCase());
      const word={nl:"pods bijgeplaatst",fr:"pods ajoutés",en:"pods added"}[state.lang];
      const one={nl:"pod bijgeplaatst",fr:"pod ajouté",en:"pod added"}[state.lang];
      let line="-"+n+" "+(n===1?one:word);
      if(roomNames.length) line+=": "+roomNames.join(", ");
      insert(line);
      // reset picker
      podN=0; rooms.clear();
      host.querySelectorAll("#podCount button,#podRooms button").forEach(x=>x.classList.remove("sel"));
    });
  }
}

/* ---------- tooltip ---------- */
const tip=$("tip"); let tipT;
function showTip(el,html){
  tip.innerHTML=html.replace(/⚠[^.]*\./g,m=>`<span class="warn">${m}</span>`);
  tip.classList.add("show");
  const r=el.getBoundingClientRect(); tip.style.left="0px";tip.style.top="0px";
  const tw=tip.offsetWidth,th=tip.offsetHeight;
  let left=r.left, top=r.bottom+8;
  if(left+tw>window.innerWidth-8) left=window.innerWidth-8-tw; if(left<8)left=8;
  if(top+th>window.innerHeight-8) top=r.top-th-8;
  tip.style.left=left+"px";tip.style.top=top+"px";
}
function hideTip(){tip.classList.remove("show");}
function attachTip(el,getHtml){
  if(!el) return;
  el.addEventListener("mouseenter",()=>{clearTimeout(tipT);showTip(el,getHtml());});
  el.addEventListener("mouseleave",()=>{tipT=setTimeout(hideTip,80);});
  el.addEventListener("click",e=>{e.stopPropagation(); tip.classList.contains("show")?hideTip():showTip(el,getHtml());});
}
document.addEventListener("click",e=>{ if(!e.target.closest(".qm")) hideTip(); });
window.addEventListener("scroll",hideTip,true);

function escapeHtml(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ---------- nav ---------- */
function next(){ const list=steps(); if(state.idx<list.length-1){state.idx++; window.scrollTo(0,0); render();} }
function back(){ if(state.idx>0){state.idx--; window.scrollTo(0,0); render();} }
$("btnBack").addEventListener("click",back);
$("btnNext").addEventListener("click",()=>{ if(!$("btnNext").disabled) next(); });
/* Ctrl+Enter = Next (works even while typing in a textarea/input) */
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey) && e.key==="Enter"){ e.preventDefault(); if(!$("btnNext").disabled && $("btnNext").style.display!=="none") next(); }
});

/* allow manual editing of the output on any step (advanced) */
out.addEventListener("input",()=>{ state.log=out.value; /* manual override not fed back to answers */ save(); });

/* ---------- copy / new ---------- */
let toastT;
function toast(msg){const el=$("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),1200);}
function copyLog(){
  const text=out.value; const done=()=>toast(tr().copied);
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done,()=>fb(text,done)); else fb(text,done);
}
function fb(text,cb){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);cb&&cb();}
$("btnCopy").addEventListener("click",copyLog);
$("btnNew").addEventListener("click",()=>{
  if(!confirm(tr().newConfirm)) return;
  state.idx=0;state.answers={};state.jobKind=null;state.jobNet=null;state.installChecks=[];state.situatie="";state.situationLines=[];state.situationActive=-1;state.situationCustom="";state.caseTypes=[];state.boxtype=null;state.wifiplat=null;state.actie="";state.result="";state.log="";
  render();
});

/* ---------- language ---------- */
document.querySelectorAll("#langs .chip").forEach(b=>b.addEventListener("click",()=>{
  state.lang=b.dataset.lang; document.documentElement.lang=state.lang; render();
}));

/* ---------- modem model modal ---------- */
const modelModal=$("modelModal");
$("modelCancel").addEventListener("click",()=>modelModal.classList.remove("show"));
modelModal.addEventListener("click",e=>{ if(e.target===modelModal) modelModal.classList.remove("show"); });

/* ---------- modemtest modal ---------- */
const mt=$("mtModal"); let mttab="align";
function applyMtText(){
  $("mtTitle").textContent=tr().mtTitle; $("mtSub").textContent=tr().mtSub;
  $("mtTabAlign").textContent=tr().tabAlign; $("mtTabFields").textContent=tr().tabFields;
  $("lblPaste").textContent=tr().paste; $("mtAlignHint").textContent=tr().alignHint;
  $("mtInsert").textContent=tr().insert; $("mtCancel").textContent=tr().cancel;
}
$("btnMt").addEventListener("click",()=>{ applyMtText(); $("mtPaste").value="";["fRx","fTx","fSnr","fMac"].forEach(id=>$(id).value=""); setMtTab(mttab); mt.classList.add("show"); });
$("mtCancel").addEventListener("click",()=>mt.classList.remove("show"));
mt.addEventListener("click",e=>{ if(e.target===mt) mt.classList.remove("show"); });
document.querySelectorAll("#mtTabs .chip").forEach(c=>c.addEventListener("click",()=>setMtTab(c.dataset.mttab)));
function setMtTab(tab){ mttab=tab; $("mtAlign").style.display=tab==="align"?"block":"none"; $("mtFields").style.display=tab==="fields"?"block":"none";
  document.querySelectorAll("#mtTabs .chip").forEach(c=>c.classList.toggle("active",c.dataset.mttab===tab)); }
function alignModemtest(raw){ return raw.replace(/\r/g,"").split("\n").map(l=>l.trim()===""?"":l.trim().replace(/[ \t]{1,}/g,"\t")).join("\n"); }
$("mtInsert").addEventListener("click",()=>{
  let block="";
  if(mttab==="align"){ const raw=$("mtPaste").value; if(raw.trim()) block="MODEMTEST:\n"+alignModemtest(raw); }
  else { const rx=$("fRx").value.trim(),tx=$("fTx").value.trim(),snr=$("fSnr").value.trim(),mac=$("fMac").value.trim();
    const ls=[]; if(mac)ls.push("MAC "+mac); if(rx)ls.push("Rx\t"+rx); if(tx)ls.push("Tx\t"+tx); if(snr)ls.push("Snr\t"+snr); block=ls.join("\n"); }
  if(block){
    // append modemtest into the Result section text so it lands in the log
    state.result = state.result ? state.result.replace(/\s*$/,"")+"\n"+block : block;
    refreshLog();
    toast(tr().insert);
  }
  mt.classList.remove("show");
});

/* ---------- log expand overlay ---------- */
const logModal=$("logModal"), outBig=$("outBig");
function openLog(){ outBig.value=out.value; logModal.classList.add("show"); outBig.focus(); }
function closeLog(){ out.value=outBig.value; state.log=out.value; save(); logModal.classList.remove("show"); }
$("btnExpand").addEventListener("click",openLog);
$("lmClose").addEventListener("click",closeLog);
$("lmDone").addEventListener("click",closeLog);
logModal.addEventListener("click",e=>{ if(e.target===logModal) closeLog(); });
outBig.addEventListener("input",()=>{ out.value=outBig.value; state.log=out.value; save(); });
$("lmCopy").addEventListener("click",()=>{
  const text=outBig.value; const done=()=>toast(tr().copied);
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done,()=>fb(text,done)); else fb(text,done);
});

/* ---------- boot ---------- */
load(); document.documentElement.lang=state.lang; render();
</script>
